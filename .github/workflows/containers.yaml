name: Publish container images

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cave
            dockerfile: Containerfile.local
          - name: cave-runner
            dockerfile: Containerfile.runner
          - name: cave-zoekt
            dockerfile: Containerfile.zoekt
          - name: cave-scan
            dockerfile: Containerfile.scan
          - name: cave-fix
            dockerfile: Containerfile.fix
          - name: cave-actions
            dockerfile: Containerfile.actions
    steps:
      - uses: actions/checkout@v4

      # cave and cave-runner both need the Lisp toolchain in the build context:
      # cave's Containerfile COPYs the ocicl/ deps dir; cave-runner's Containerfile
      # COPYs a pre-built cave binary. Skip for cave-zoekt (fully self-contained).
      - name: Install SBCL and ocicl
        if: matrix.name == 'cave' || matrix.name == 'cave-runner'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
          gh release download --repo ocicl/ocicl --pattern '*_amd64.deb' --dir /tmp
          sudo dpkg -i /tmp/ocicl_*_amd64.deb
          ocicl setup > ~/.sbclrc

      - name: Fetch Lisp dependencies
        if: matrix.name == 'cave' || matrix.name == 'cave-runner'
        run: ocicl install

      # Containerfile.local (used by the cave image) needs cave-server, cave
      # (the CLI), and zoekt-git-index pre-built and present in the build
      # context. Containerfile.runner only needs cave-server.
      - name: Pre-build cave binaries
        if: matrix.name == 'cave'
        run: make cave-server cave zoekt-git-index

      - name: Pre-build cave-server binary
        if: matrix.name == 'cave-runner'
        run: make cave-server

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          TAGS="$IMG:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="$TAGS,$IMG:main"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$TAGS,$IMG:$VERSION,$IMG:prod,$IMG:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
