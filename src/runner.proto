syntax = "proto3";

package cave.runner;

message RegisterRunnerRequest {
  string name = 1;
  string runner_labels = 2;
  bool ephemeral = 3;
  string registration_token = 4;
}

message RegisterRunnerResponse {
  int64 runner_id = 1;
  string auth_token = 2;
}

message DeclareRunnerRequest {
  string runner_labels = 1;
}

message DeclareRunnerResponse {
  bool ok = 1;
}

message FetchTaskRequest {
}

message FetchTaskResponse {
  bool has_task = 1;
  int64 run_id = 2;
  string repo_owner = 3;
  string repo_name = 4;
  string command = 5;
  string commit_sha = 6;
  string ref = 7;
  int32 timeout_seconds = 8;
  int64 job_id = 9;
  string image = 10;
  repeated StepSpec steps = 11;
  string clone_url = 12;
}

message AppendTaskLogRequest {
  int64 run_id = 1;
  string chunk = 2;
}

message AppendTaskLogResponse {
  bool ok = 1;
}

message UpdateTaskStatusRequest {
  int64 run_id = 1;
  string status = 2;
}

message UpdateTaskStatusResponse {
  bool ok = 1;
}

message WatchTasksRequest {
  string runner_labels = 1;
}

message TaskEvent {
  int64 run_id = 1;
  string repo_owner = 2;
  string repo_name = 3;
  string command = 4;
  string commit_sha = 5;
  string ref = 6;
  int32 timeout_seconds = 7;
  int64 job_id = 8;
  string image = 9;
  repeated StepSpec steps = 10;
  string clone_url = 11;
}

message StepSpec {
  int64 step_id = 1;
  int32 step_order = 2;
  string name = 3;
  string command = 4;
  int32 timeout_seconds = 5;
}

message UpdateStepStatusRequest {
  int64 step_id = 1;
  string status = 2;
  int32 exit_code = 3;
}

message UpdateStepStatusResponse {
  bool ok = 1;
}

message AppendStepLogRequest {
  int64 step_id = 1;
  string chunk = 2;
}

message AppendStepLogResponse {
  bool ok = 1;
}
