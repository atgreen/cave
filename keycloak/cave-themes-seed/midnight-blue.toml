# Midnight Blue — a cool-toned dark theme for Cave
#
# To use: fork cave/cave-themes to your account, edit this file
# (or add new .toml files), push, then select the theme in Settings.
#
# Each key maps to a CSS variable (--key). Colors must be valid CSS:
#   #hex      — e.g. #1e293b
#   rgb()     — e.g. rgb(30, 41, 59)
#   rgba()    — e.g. rgba(96, 165, 250, 0.1)
#
# Special keys:
#   font-url  — URL to @import (e.g. Google Fonts)
#   font-mono — monospace font for code, headings, nav
#   font-body — body text font

# ── Fonts (optional — remove to use defaults) ──
font-url = "https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
font-mono = "'Fira Code', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
font-body = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"

# ── Backgrounds ──
bg = "#0f172a"
bg-warm = "#1e293b"
surface = "#1e293b"
surface-hover = "#334155"

# ── Borders ──
border = "#334155"
border-subtle = "#1e293b"

# ── Text ──
text = "#e2e8f0"
text-secondary = "#94a3b8"
text-muted = "#64748b"

# ── Accent (the signature color) ──
accent = "#60a5fa"
accent-dim = "#3b82f6"
accent-bg = "rgba(96, 165, 250, 0.08)"

# ── Links ──
link = "#60a5fa"
link-hover = "#93c5fd"

# ── Semantic colors ──
green = "#4ade80"
green-bright = "#86efac"
green-bg = "rgba(74, 222, 128, 0.10)"

red = "#f87171"
red-bg = "rgba(248, 113, 113, 0.10)"

yellow = "#fbbf24"
yellow-bg = "rgba(251, 191, 36, 0.08)"

blue = "#60a5fa"
blue-bg = "rgba(96, 165, 250, 0.08)"
