name: gha-selftest
on: [push]
jobs:
  envtest:
    image: ghcr.io/atgreen/fedora-cave-builder:latest
    env:
      WF_VAR: from-workflow
    steps:
      - name: env + file-commands
        env:
          STEP_VAR: from-step
        run: |
          echo "REPO=$GITHUB_REPOSITORY CAVE_REPO=$CAVE_REPOSITORY"
          echo "SHA=$GITHUB_SHA CAVE_SHA=$CAVE_SHA"
          echo "REFNAME=$GITHUB_REF_NAME ACTOR=$GITHUB_ACTOR EVENT=$GITHUB_EVENT_NAME"
          echo "CI=$CI GHA=$GITHUB_ACTIONS RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
          echo "WS=$GITHUB_WORKSPACE CAVE_WS=$CAVE_WORKSPACE"
          echo "WF_VAR=$WF_VAR STEP_VAR=$STEP_VAR"
          echo "CARRIED=carried-ok" >> "$GITHUB_ENV"
          mkdir -p /tmp/binz && echo /tmp/binz >> "$GITHUB_PATH"
          echo "MYOUT=hi" >> "$GITHUB_OUTPUT"
          echo "## selftest summary line" >> "$GITHUB_STEP_SUMMARY"
          echo "::add-mask::supersecretXYZ"
          echo "this supersecretXYZ must be masked"
      - name: carry-forward
        run: |
          echo "CARRIED=$CARRIED"
          case ":$PATH:" in *":/tmp/binz:"*) echo "PATH-OK" ;; *) echo "PATH-MISSING" ;; esac
