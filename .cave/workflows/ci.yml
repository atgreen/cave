name: CI
on: [push, pull_request]
jobs:
  build:
    image: ghcr.io/atgreen/fedora-cave-builder:latest
    steps:
      - name: Install dependencies
        run: ocicl install
      - name: List files (pre)
        run: ls -l
      - name: Build Cave
        run: make build
      - name: List files (post)
        run: ls -l
	
