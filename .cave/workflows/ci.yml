name: CI
on: [push, pull_request]
jobs:
  build:
    image: ghcr.io/atgreen/fedora-cave-builder:latest
    steps:
      - name: Install dependencies
        run: ocicl install && find ocicl -exec touch -d @1 {} +
      - name: List files (pre)
        run: ls -l
      - name: Build Cave
        # Build cave's own artifacts only. `make build` also compiles the
        # vendored third-party zoekt-git-index (huge Go dep tree that flakily
        # hangs on `go: downloading` — see #9); the prod image builds zoekt in
        # its own stage, so CI doesn't need it to validate that cave compiles.
        run: make cave-server cave cavectl
      - name: List files (post)
        run: ls -l
	
