name: Release
# Only runs when a tag is pushed (ref refs/tags/*), never on ordinary commits.
on: [tag]
jobs:
  build:
    image: ghcr.io/atgreen/fedora-cave-builder:latest
    timeout: 1800
    cache:
      - /root/.cache/common-lisp
    steps:
      - name: Resolve release tag
        run: |
          set -e
          TAG=$(git describe --tags --exact-match HEAD)
          echo "Building release for $TAG"
          echo "$TAG" > /workspace/.release-tag

      - name: Install Lisp dependencies
        run: ocicl install

      - name: Build cave binary
        run: make cave-server cave

      - name: Verify the binary runs
        run: |
          ./cave-server --version || true
          ls -lah cave-server cave

      - name: Generate SBOMs
        run: |
          ocicl create-sbom cyclonedx cave-sbom.json
          ocicl create-sbom spdx cave-sbom.spdx.json
          ls -lah cave-sbom.json cave-sbom.spdx.json

      - name: Summary
        run: |
          TAG=$(cat /workspace/.release-tag)
          echo "===================================================="
          echo "Release build complete for $TAG"
          echo "  cave-server         — server binary"
          echo "  cave                — CLI client"
          echo "  cave-sbom.json      — CycloneDX SBOM"
          echo "  cave-sbom.spdx.json — SPDX SBOM"
          echo "Container images are published by ci.yml to"
          echo "ghcr.io/atgreen/cave:main on every push."
          echo "===================================================="
